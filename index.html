<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safe LPG Gas Bill</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    }

    :root{
        --maroon-1:#4A0A2A;
        --maroon-2:#6D0F3D;
        --maroon-3:#8E1B54;
        --maroon-logo:#750341;
        --maroon-light:#F6E8EF;
        --gold:#C9A15A;
        --gold-dark:#a9823f;
        --ink:#1a1a1a;
        --soft:#FBF6F9;
        --grey:#7a6c74;
    }

    html,body{
        height:100%;
    }

    body{
        background:#eae3e8;
        background-image:
            radial-gradient(circle at 18% 8%, #e3cddb 0%, transparent 42%),
            radial-gradient(circle at 82% 92%, #d8bccb 0%, transparent 42%);
        padding:20px;
    }

    .page{
        width:210mm;
        height:297mm;
        margin:0 auto 22px auto;
        background:#fff;
        display:grid;
        grid-template-columns:1fr 1fr;
        grid-template-rows:1fr 1fr;
        gap:5mm;
        padding:8mm;
        box-shadow:0 18px 60px rgba(74,10,42,0.18);
        border-radius:6px;
        overflow:hidden;
    }

    /* ====== BILL CARD ====== */
    .bill{
        position:relative;
        border:1.4px solid var(--maroon-3);
        border-radius:10px;
        display:flex;
        flex-direction:column;
        font-size:11px;
        overflow:hidden;
        background:#fff;
        box-shadow:0 6px 16px rgba(74,10,42,0.10);
        height:92%;
    }

    /* Header */
    .header{
        position:relative;
        z-index:1;
        background:linear-gradient(135deg, var(--maroon-1) 0%, var(--maroon-2) 55%, var(--maroon-3) 100%);
        color:#fff;
        padding:7px 10px;
        display:flex;
        align-items:center;
        gap:9px;
        border-bottom:3px solid var(--gold);
    }

    .header .logo-box{
        background:#fff;
        border-radius:7px;
        padding:4px 8px;
        display:flex;
        align-items:center;
        flex-shrink:0;
        box-shadow:0 2px 6px rgba(0,0,0,0.22);
    }

    .header .logo-box img{
        height:24px;
        width:auto;
        display:block;
    }

    .header .head-text{
        flex:1;
        line-height:1.15;
        min-width:0;
    }

    .header .brand{
        font-size:13.5px;
        font-weight:800;
        letter-spacing:0.5px;
    }

    .header .sub{
        font-size:8px;
        text-transform:uppercase;
        letter-spacing:1.3px;
        opacity:0.88;
        margin-top:1px;
    }

    .header .bill-tag{
        font-size:8px;
        background:var(--gold);
        color:#3a1f00;
        padding:3px 7px;
        border-radius:3px;
        font-weight:700;
        letter-spacing:0.4px;
        text-transform:uppercase;
        white-space:nowrap;
        flex-shrink:0;
    }

    /* Body */
    .body{
        position:relative;
        z-index:1;
        padding:7px 9px 6px 9px;
        flex:1;
        display:flex;
        flex-direction:column;
        min-height:0;
    }

    .meta-row{
        display:flex;
        justify-content:space-between;
        font-size:8px;
        color:var(--maroon-3);
        margin-bottom:5px;
        font-weight:600;
        text-transform:uppercase;
        letter-spacing:0.35px;
        line-height:1.15;
    }

    .meta-row span b{
        color:var(--maroon-1);
    }

    table{
        width:100%;
        border-collapse:collapse;
        background:transparent;
    }

    td{
        padding:3.4px 7px;
        font-size:10.2px;
        line-height:1.15;
        border-bottom:1px solid #f0e3ea;
        vertical-align:middle;
        background:rgba(255,255,255,0.72);
    }

    tr:nth-child(even) td{
        background:rgba(246,232,239,0.62);
    }

    td:first-child{
        width:48%;
        font-weight:600;
        color:var(--maroon-1);
        border-right:1px solid #f0e3ea;
    }

    td:first-child::before{
        content:"";
        display:inline-block;
        width:3px;
        height:9px;
        background:var(--maroon-3);
        margin-right:6px;
        vertical-align:middle;
        border-radius:2px;
    }

    td:last-child input{
        color:var(--ink);
        font-weight:500;
    }

    input{
        width:100%;
        border:none;
        outline:none;
        font-size:10.5px;
        line-height:1.15;
        background:transparent;
        font-family:inherit;
        padding:1px 0;
    }

    input[type="month"]{
        cursor:pointer;
    }

    /* Total row highlight */
    tr.total-row td{
        background:linear-gradient(90deg, rgba(246,232,239,0.85), rgba(255,255,255,0.85));
        border-top:2px solid var(--gold);
        border-bottom:2px solid var(--gold);
        padding:5.5px 7px;
    }

    tr.total-row td:first-child{
        color:var(--maroon-1);
        font-weight:800;
        font-size:11px;
        border-right:1px solid rgba(201,161,90,0.4);
    }

    tr.total-row td:first-child::before{
        background:var(--gold-dark);
    }

    tr.total-row input{
        color:#b5122f !important;
        font-weight:800 !important;
        font-size:13px !important;
        letter-spacing:0.4px;
    }

    .note{
        margin-top:11px;
        text-align:center;
        font-size:8.5px;
        color:var(--maroon-3);
        background:var(--maroon-light);
        padding:3px 6px;
        border-radius:4px;
        font-weight:600;
        letter-spacing:0.25px;
        line-height:1.2;
    }

    .footer{
        margin-top:20px;
        padding-top:8px;
        display:flex;
        justify-content:space-between;
        gap:8px;
        align-items:flex-end;
    }

    .sign-box{
        width:42%;
        text-align:center;
        font-size:8.5px;
        color:#444;
    }

    .sign-line{
        border-top:1.4px dashed var(--maroon-2);
        padding-top:2px;
        font-weight:600;
        letter-spacing:0.25px;
    }

    .stamp{
        width:50px;
        height:50px;
        border:2px solid var(--gold);
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        color:var(--maroon-1);
        font-size:7px;
        font-weight:800;
        text-align:center;
        line-height:1.1;
        transform:rotate(-8deg);
        opacity:0.9;
        flex-shrink:0;
        background:rgba(201,161,90,0.08);
        letter-spacing:0.3px;
    }

    .footer-meta{
        text-align:center;
        font-size:7px;
        color:#9a8b93;
        margin-top:5px;
        letter-spacing:0.3px;
    }

    /* ====== BUTTONS ====== */
    .btn-area{
        text-align:center;
        margin:24px auto;
        max-width:210mm;
        display:flex;
        justify-content:center;
        flex-wrap:wrap;
        gap:10px;
    }

    button{
        padding:11px 24px;
        font-size:14px;
        cursor:pointer;
        border:none;
        border-radius:6px;
        font-weight:600;
        letter-spacing:0.4px;
        color:#fff;
        background:linear-gradient(135deg, var(--maroon-1), var(--maroon-3));
        box-shadow:0 4px 12px rgba(74,10,42,0.3);
        transition:transform .15s ease, box-shadow .15s ease;
    }

    button:hover{
        transform:translateY(-2px);
        box-shadow:0 6px 18px rgba(74,10,42,0.42);
    }

    button:nth-child(2){background:linear-gradient(135deg,#1f7a3a,#3bbf5a);}
    button:nth-child(3){background:linear-gradient(135deg,#9a3a3a,#d76060);}

    /* ====== PRINT ====== */
    @media print{
        body{background:#fff;padding:0;}
        .btn-area{display:none;}
        .page{

function buildBillHTML(i){
    const billNo = String(i).padStart(3,'0');
    return `
    <div class="bill">
        <div class="header">
            <div class="logo-box"><img src="${LOGO_URL}" alt="SAFE Community Group"></div>
            <div class="head-text">
                <div class="brand">LPG GAS BILL</div>
                <div class="sub">Community Group • Reticulation</div>
            </div>
            <div class="bill-tag">BILL #${billNo}</div>
        </div>
        <div class="body">
            <div class="meta-row">
                <span>Invoice No: <b>SL-${billNo}-2024</b></span>
                <span>Due: <b>5th of Month</b></span>
            </div>
            <table>
                <tr><td>Building Name</td><td><input type="text" id="building${i}" value="Safe Garden 1"></td></tr>
                <tr><td>Flat No</td><td><input type="text" id="flat${i}" value="A-1"></td></tr>
                <tr><td>Month</td><td><input type="month" id="month${i}"></td></tr>
                <tr><td>Running Unit</td><td><input type="number" step="0.001" id="running${i}"></td></tr>
                <tr><td>Previous Unit</td><td><input type="number" step="0.001" id="previous${i}"></td></tr>
                <tr><td>Consume Unit</td><td><input readonly id="consume${i}"></td></tr>
                <tr><td>Conversion into Kg</td><td><input readonly id="kg${i}"></td></tr>
                <tr><td>Price per Kg</td><td><input type="number" id="price${i}" value="142"></td></tr>
                <tr><td>Service Charge</td><td><input type="number" id="service${i}" value="50"></td></tr>
                <tr class="total-row"><td><b>TOTAL PRICE</b></td><td><input readonly id="total${i}"></td></tr>
                <tr><td>Mobile No</td><td><input type="text" id="mobile${i}" value="0199123123"></td></tr>
            </table>
            <p class="note">⏰ Payable bill within the 5th of every Month</p>
            <div class="footer">
                <div class="sign-box">
                    <div class="sign-line">Received By</div>
                </div>
                <div class="stamp"> </div>
                <div class="sign-box">
                    <div class="sign-line">Authorized By</div>
                </div>
            </div>
            <div class="footer-meta">Safe Community Group • Helpline: 0199123123 • www.safelpg.com</div>
        </div>
    </div>`;
}

function calculate(i){
    const running = document.getElementById(`running${i}`);
    const previous = document.getElementById(`previous${i}`);
    const consume = document.getElementById(`consume${i}`);
    const kg = document.getElementById(`kg${i}`);
    const price = document.getElementById(`price${i}`);
    const service = document.getElementById(`service${i}`);
    const total = document.getElementById(`total${i}`);

    let runningUnit = parseFloat(running.value) || 0;
    let previousUnit = parseFloat(previous.value) || 0;
    let pricePerKg = parseFloat(price.value) || 0;
    let serviceCharge = parseFloat(service.value) || 0;

    if(runningUnit < previousUnit){
        consume.value = "";
        kg.value = "";
        total.value = "";
        return;
    }

    let consumeUnit = runningUnit - previousUnit;
    consume.value = consumeUnit.toFixed(3);

    let totalKg = consumeUnit * CONVERSION_FACTOR;
    kg.value = totalKg.toFixed(2);

    let gasBill = totalKg * pricePerKg;
    let grandTotal = gasBill + serviceCharge;
    total.value = Math.round(grandTotal);
}

function calculateAll(){
    for(let i = 1; i <= TOTAL_BILLS; i++){
        calculate(i);
    }
}

function attachListeners(i){
    ["running","previous","price","service"].forEach(field=>{
        document.getElementById(`${field}${i}`).addEventListener("input", ()=>calculate(i));
    });
}

const page = document.getElementById("page");
let html = "";
for(let i = 1; i <= TOTAL_BILLS; i++){
    html += buildBillHTML(i);
}
page.innerHTML = html;

for(let i = 1; i <= TOTAL_BILLS; i++){
    attachListeners(i);
    calculate(i);
}
</script>

</body>
</html>
