<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safe LPG Gas Bill</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    }

    :root{
        --purple-1:#4B1D6E;
        --purple-2:#6A2C8F;
        --purple-3:#8E3FB8;
        --purple-light:#F3E9FA;
        --gold:#C9A227;
        --ink:#1a1a1a;
        --soft:#f7f4fb;
    }

    body{
        background:#e9e6ee;
        background-image:
            radial-gradient(circle at 20% 10%, #d9ccea 0%, transparent 40%),
            radial-gradient(circle at 80% 90%, #c8b6e0 0%, transparent 40%);
        padding:24px;
        min-height:100vh;
    }

    .page{
        width:210mm;
        min-height:297mm;
        margin:0 auto 24px auto;
        background:#fff;
        display:grid;
        grid-template-columns:1fr 1fr;
        grid-template-rows:1fr 1fr;
        gap:6mm;
        padding:10mm;
        box-shadow:0 18px 60px rgba(75,29,110,0.18);
        border-radius:6px;
    }

    /* ====== BILL CARD ====== */
    .bill{
        position:relative;
        border:1.5px solid var(--purple-2);
        border-radius:10px;
        padding:0;
        display:flex;
        flex-direction:column;
        font-size:12px;
        overflow:hidden;
        background:#fff;
        box-shadow:0 6px 18px rgba(75,29,110,0.10);
    }

    /* Watermark */
    .bill::before{
        content:"";
        position:absolute;
        inset:0;
        background-image:url('https://z-cdn-media.chatglm.cn/files/ecf32448-38ba-4636-ac28-1e2917b84c82.png?auth_key=1885997797-aaa644ae2e914ee18df0c9fdb812a303-0-9e3684e0bad3f1e2d288d9bb0992a213');
        background-repeat:no-repeat;
        background-position:center 62%;
        background-size:55% auto;
        opacity:0.06;
        pointer-events:none;
        z-index:0;
    }

    /* Header */
    .header{
        position:relative;
        z-index:1;
        background:linear-gradient(135deg, var(--purple-1) 0%, var(--purple-2) 55%, var(--purple-3) 100%);
        color:#fff;
        padding:10px 12px;
        display:flex;
        align-items:center;
        gap:10px;
        border-bottom:3px solid var(--gold);
    }

    .header .logo{
        width:46px;
        height:46px;
        border-radius:50%;
        background:#fff;
        padding:2px;
        flex-shrink:0;
        box-shadow:0 2px 6px rgba(0,0,0,0.25);
    }

    .header .logo img{
        width:100%;
        height:100%;
        object-fit:contain;
        border-radius:50%;
    }

    .header .head-text{
        flex:1;
        line-height:1.15;
    }

    .header .brand{
        font-size:15px;
        font-weight:800;
        letter-spacing:0.6px;
    }

    .header .sub{
        font-size:9px;
        text-transform:uppercase;
        letter-spacing:1.5px;
        opacity:0.9;
        margin-top:1px;
    }

    .header .bill-tag{
        font-size:8.5px;
        background:var(--gold);
        color:#3a1f00;
        padding:3px 7px;
        border-radius:3px;
        font-weight:700;
        letter-spacing:0.5px;
        text-transform:uppercase;
        white-space:nowrap;
    }

    /* Body */
    .body{
        position:relative;
        z-index:1;
        padding:10px 12px 8px 12px;
        flex:1;
        display:flex;
        flex-direction:column;
    }

    .meta-row{
        display:flex;
        justify-content:space-between;
        font-size:9px;
        color:#6a4a86;
        margin-bottom:6px;
        font-weight:600;
        text-transform:uppercase;
        letter-spacing:0.4px;
    }

    .meta-row span b{
        color:var(--purple-1);
    }

    table{
        width:100%;
        border-collapse:collapse;
        background:#fff;
    }

    td{
        padding:5px 7px;
        font-size:11px;
        border-bottom:1px solid #ece4f5;
        vertical-align:middle;
    }

    tr:nth-child(even) td{
        background:var(--soft);
    }

    td:first-child{
        width:48%;
        font-weight:600;
        color:var(--purple-1);
        border-right:1px solid #ece4f5;
    }

    td:first-child::before{
        content:"";
        display:inline-block;
        width:3px;
        height:10px;
        background:var(--purple-3);
        margin-right:6px;
        vertical-align:middle;
        border-radius:2px;
    }

    td:last-child input{
        color:var(--ink);
        font-weight:500;
    }

    input{
        width:100%;
        border:none;
        outline:none;
        font-size:11.5px;
        background:transparent;
        font-family:inherit;
        padding:1px 0;
    }

    input[type="month"]{
        cursor:pointer;
    }

    /* Total row highlight */
    tr.total-row td{
        background:linear-gradient(90deg, var(--purple-light), #fff);
        border-top:2px solid var(--purple-3);
        border-bottom:2px solid var(--purple-3);
        padding:7px;
    }

    tr.total-row td:first-child{
        color:var(--purple-1);
        font-weight:800;
        font-size:12px;
    }

    tr.total-row input{
        color:#c00 !important;
        font-weight:800 !important;
        font-size:14px !important;
        letter-spacing:0.5px;
    }

    .note{
        margin-top:8px;
        text-align:center;
        font-size:9.5px;
        color:#7a5b95;
        background:var(--purple-light);
        padding:4px 6px;
        border-radius:4px;
        font-weight:600;
        letter-spacing:0.3px;
    }

    .footer{
        margin-top:auto;
        padding-top:14px;
        display:flex;
        justify-content:space-between;
        gap:10px;
        align-items:flex-end;
    }

    .sign-box{
        width:42%;
        text-align:center;
        font-size:9.5px;
        color:#444;
    }

    .sign-line{
        border-top:1.5px dashed var(--purple-2);
        padding-top:3px;
        font-weight:600;
        letter-spacing:0.3px;
    }

    .stamp{
        width:60px;
        height:60px;
        border:2px solid var(--gold);
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        color:var(--gold);
        font-size:8px;
        font-weight:800;
        text-align:center;
        line-height:1.1;
        transform:rotate(-8deg);
        opacity:0.85;
        flex-shrink:0;
        background:rgba(201,162,39,0.05);
    }

    .footer-meta{
        text-align:center;
        font-size:8px;
        color:#999;
        margin-top:6px;
        letter-spacing:0.4px;
    }

    /* ====== BUTTONS ====== */
    .btn-area{
        text-align:center;
        margin:24px auto;
        max-width:210mm;
        display:flex;
        justify-content:center;
        flex-wrap:wrap;
        gap:10px;
    }

    button{
        padding:11px 24px;
        font-size:14px;
        cursor:pointer;
        border:none;
        border-radius:6px;
        font-weight:600;
        letter-spacing:0.4px;
        color:#fff;
        background:linear-gradient(135deg, var(--purple-1), var(--purple-3));
        box-shadow:0 4px 12px rgba(75,29,110,0.3);
        transition:transform .15s ease, box-shadow .15s ease;
    }

    button:hover{
        transform:translateY(-2px);
        box-shadow:0 6px 18px rgba(75,29,110,0.42);
    }

    button:nth-child(2){background:linear-gradient(135deg,#1f7a3a,#3bbf5a);}
    button:nth-child(3){background:linear-gradient(135deg,#9a3a3a,#d76060);}

    /* ====== PRINT ====== */
    @media print{
        body{background:#fff;padding:0;}
        .btn-area{display:none;}
        .page{
            margin:0;
            box-shadow:none;
            border-radius:0;
            page-break-after:always;
        }
        .page:last-child{page-break-after:auto;}
        .bill{box-shadow:none;}
    }

    @page{size:A4;margin:0;}
</style>
</head>
<body>

<div class="page" id="page"></div>

<div class="btn-area">
    <button onclick="calculateAll()">Calculate All</button>
    <button onclick="window.print()">Print</button>
    <button onclick="location.reload()">Reset</button>
</div>

<script>
const CONVERSION_FACTOR = 2.35;
const TOTAL_BILLS = 4;
const LOGO_URL = 'https://z-cdn-media.chatglm.cn/files/ecf32448-38ba-4636-ac28-1e2917b84c82.png?auth_key=1885997797-aaa644ae2e914ee18df0c9fdb812a303-0-9e3684e0bad3f1e2d288d9bb0992a213';

function buildBillHTML(i){
    const billNo = String(i).padStart(3,'0');
    return `
    <div class="bill">
        <div class="header">
            <div class="logo"><img src="${LOGO_URL}" alt="logo"></div>
            <div class="head-text">
                <div class="brand">SAFE LPG</div>
                <div class="sub">Community Group • Reticulation</div>
            </div>
            <div class="bill-tag">BILL #${billNo}</div>
        </div>
        <div class="body">
            <div class="meta-row">
                <span>Invoice No: <b>SL-${billNo}-2024</b></span>
                <span>Due: <b>5th of Month</b></span>
            </div>
            <table>
                <tr><td>Building Name</td><td><input type="text" id="building${i}" value="Safe Garden 1"></td></tr>
                <tr><td>Flat No</td><td><input type="text" id="flat${i}" value="A-1"></td></tr>
                <tr><td>Month</td><td><input type="month" id="month${i}"></td></tr>
                <tr><td>Running Unit</td><td><input type="number" step="0.001" id="running${i}"></td></tr>
                <tr><td>Previous Unit</td><td><input type="number" step="0.001" id="previous${i}"></td></tr>
                <tr><td>Consume Unit</td><td><input readonly id="consume${i}"></td></tr>
                <tr><td>Conversion into Kg</td><td><input readonly id="kg${i}"></td></tr>
                <tr><td>Price per Kg</td><td><input type="number" id="price${i}" value="142"></td></tr>
                <tr><td>Service Charge</td><td><input type="number" id="service${i}" value="50"></td></tr>
                <tr class="total-row"><td><b>TOTAL PRICE</b></td><td><input readonly id="total${i}"></td></tr>
                <tr><td>Mobile No</td><td><input type="text" id="mobile${i}" value="0199123123"></td></tr>
            </table>
            <p class="note">⏰ Payable bill within the 5th of every Month</p>
            <div class="footer">
                <div class="sign-box">
                    <div class="sign-line">Received By</div>
                </div>
                <div class="stamp">SAFE<br>LPG<br>SEAL</div>
                <div class="sign-box">
                    <div class="sign-line">Authorized By</div>
                </div>
            </div>
            <div class="footer-meta">Safe Community Group • Helpline: 0199123123 • www.safelpg.com</div>
        </div>
    </div>`;
}

function calculate(i){
    const running = document.getElementById(`running${i}`);
    const previous = document.getElementById(`previous${i}`);
    const consume = document.getElementById(`consume${i}`);
    const kg = document.getElementById(`kg${i}`);
    const price = document.getElementById(`price${i}`);
    const service = document.getElementById(`service${i}`);
    const total = document.getElementById(`total${i}`);

    let runningUnit = parseFloat(running.value) || 0;
    let previousUnit = parseFloat(previous.value) || 0;
    let pricePerKg = parseFloat(price.value) || 0;
    let serviceCharge = parseFloat(service.value) || 0;

    if(runningUnit < previousUnit){
        consume.value = "";
        kg.value = "";
        total.value = "";
        return;
    }

    let consumeUnit = runningUnit - previousUnit;
    consume.value = consumeUnit.toFixed(3);

    let totalKg = consumeUnit * CONVERSION_FACTOR;
    kg.value = totalKg.toFixed(2);

    let gasBill = totalKg * pricePerKg;
    let grandTotal = gasBill + serviceCharge;
    total.value = Math.round(grandTotal);
}

function calculateAll(){
    for(let i = 1; i <= TOTAL_BILLS; i++){
        calculate(i);
    }
}

function attachListeners(i){
    ["running","previous","price","service"].forEach(field=>{
        document.getElementById(`${field}${i}`).addEventListener("input", ()=>calculate(i));
    });
}

const page = document.getElementById("page");
let html = "";
for(let i = 1; i <= TOTAL_BILLS; i++){
    html += buildBillHTML(i);
}
page.innerHTML = html;

for(let i = 1; i <= TOTAL_BILLS; i++){
    attachListeners(i);
    calculate(i);
}
</script>

</body>
</html>
